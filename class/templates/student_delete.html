{% extends 'base.html' %}

{% block title %}
Удаление
{% endblock %}

{% block content %}

<h1>Удалить студента?</h1>

<p>
    Вы действительно хотите удалить
    <strong>{{ student.name }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Да, удалить
    </button>

    <a href="{% url 'student_detail' student.id %}">
        Отмена
    </a>

</form>

{% endblock %}
