{% extends 'base.html' %}

{% block title %}
Добавить студента
{% endblock %}

{% block content %}

<h1>Добавить студента</h1>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        placeholder="Имя"
    >

    <input
        type="number"
        name="age"
        placeholder="Возраст"
    >

    <select name="group" required>

        <option value="">
            Выберите группу
        </option>

        {% for group in groups %}

            <option value="{{ group.id }}">
                {{ group.name }}
            </option>

        {% endfor %}

    </select>

    <input
        type="file"
        name="avatar"
        accept="image/*"
    >

    <button type="submit">
        Создать
    </button>

</form>

{% endblock %}
