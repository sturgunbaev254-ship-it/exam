{% extends 'base.html' %}

{% block title %}Удалить оценку{% endblock %}

{% block content %}
<div class="confirm-card">
    <span class="eyebrow">Подтверждение</span>
    <h1>Удалить оценку?</h1>
    <p>Вы действительно хотите удалить оценку <strong>{{ mark.mark }}</strong> по предмету <strong>{{ mark.subject }}</strong> у студента <strong>{{ mark.student.name }}</strong>?</p>

    <form method="POST" class="confirm-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'student_detail' mark.student_id %}" class="btn btn-light">Отмена</a>
    </form>
</div>
{% endblock %}
