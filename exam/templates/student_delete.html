{% extends 'base.html' %}

{% block title %}Удалить студента{% endblock %}

{% block content %}
<div class="confirm-card">
    <span class="eyebrow">Подтверждение</span>
    <h1>Удалить студента?</h1>
    <p>
        Вы действительно хотите удалить <strong>{{ student.name }}</strong>?
        Вместе со студентом будут удалены все его оценки. Это действие нельзя отменить.
    </p>

    <form method="POST" class="confirm-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'student_detail' student.id %}" class="btn btn-light">Отмена</a>
    </form>
</div>
{% endblock %}
