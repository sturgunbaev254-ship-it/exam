{% extends 'base.html' %}

{% block title %}Изменить оценку{% endblock %}

{% block content %}
<div class="page-heading">
    <div>
        <span class="eyebrow">Оценки</span>
        <h1>Изменить оценку</h1>
        <p>Измените студента, предмет, учителя или оценку.</p>
    </div>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}

    <label for="student">Студент</label>
    <select id="student" name="student" required>
        {% for student in students %}
            <option value="{{ student.id }}" {% if mark.student_id == student.id %}selected{% endif %}>
                {{ student.name }}{% if student.group %} — {{ student.group.name }}{% endif %}
            </option>
        {% endfor %}
    </select>

    <label for="subject">Предмет</label>
    <input id="subject" type="text" name="subject" value="{{ mark.subject }}" required>

    <label for="teacher">Учитель</label>
    <select id="teacher" name="teacher" required>
        {% for teacher in teachers %}
            <option value="{{ teacher.id }}" {% if mark.teacher_id == teacher.id %}selected{% endif %}>
                {{ teacher.name }} — {{ teacher.get_direction_display }}
            </option>
        {% endfor %}
    </select>

    <label for="mark">Оценка</label>
    <input id="mark" type="number" name="mark" min="1" max="5" value="{{ mark.mark }}" required>

    <div class="form-actions">
        <button type="submit" class="btn">Сохранить</button>
        <a href="{% url 'student_detail' mark.student_id %}" class="btn btn-light">Отмена</a>
    </div>
</form>
{% endblock %}
